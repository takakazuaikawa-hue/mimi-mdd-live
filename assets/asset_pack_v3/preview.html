<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mimi Asset Pack v3 Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11100f;
        --panel: #1c1a18;
        --panel-2: #24211f;
        --line: #3b332e;
        --text: #f4eadf;
        --muted: #b7aaa0;
        --accent: #ff8a2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: #171513;
        position: sticky;
        top: 0;
        z-index: 5;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
      }

      main {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: calc(100vh - 58px);
      }

      aside {
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 14px;
        overflow: auto;
      }

      .content {
        padding: 18px;
        overflow: auto;
      }

      label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin: 12px 0 6px;
      }

      select,
      input {
        width: 100%;
        border: 1px solid var(--line);
        background: #0f0e0d;
        color: var(--text);
        border-radius: 6px;
        padding: 9px 10px;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        margin-bottom: 14px;
      }

      button {
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 6px;
        padding: 9px 8px;
        cursor: pointer;
      }

      button.active {
        border-color: var(--accent);
        color: white;
        background: #44220f;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 12px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
        overflow: hidden;
      }

      .thumb {
        height: 132px;
        display: grid;
        place-items: center;
        background-color: #d7d7d7;
        background-image:
          linear-gradient(45deg, #c3c3c3 25%, transparent 25%),
          linear-gradient(-45deg, #c3c3c3 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #c3c3c3 75%),
          linear-gradient(-45deg, transparent 75%, #c3c3c3 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      }

      .thumb img,
      .thumb canvas {
        max-width: 100%;
        max-height: 128px;
        object-fit: contain;
      }

      .info {
        padding: 9px 10px 11px;
      }

      .id {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .path {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
        overflow-wrap: anywhere;
      }

      .section-title {
        margin: 0 0 14px;
        font-size: 16px;
      }

      .empty {
        color: var(--muted);
        border: 1px dashed var(--line);
        padding: 22px;
        border-radius: 8px;
      }

      @media (max-width: 780px) {
        main {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Mimi Asset Pack v3 Preview</h1>
        <div class="meta" id="summary">Loading...</div>
      </div>
    </header>
    <main>
      <aside>
        <div class="tabs">
          <button id="tab-assets" class="active" type="button">Assets</button>
          <button id="tab-frames" type="button">Frames</button>
          <button id="tab-screens" type="button">Screens</button>
        </div>

        <label for="kind">Kind</label>
        <select id="kind"></select>

        <label for="screen">Screen</label>
        <select id="screen"></select>

        <label for="search">Search</label>
        <input id="search" type="search" placeholder="id / path" />
      </aside>
      <section class="content">
        <h2 class="section-title" id="title">Assets</h2>
        <div class="grid" id="grid"></div>
      </section>
    </main>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
